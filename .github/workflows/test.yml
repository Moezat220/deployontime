name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token, no secrets: the tests need nothing else, and pull requests from forks get nothing more.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # a newer push to a pull request cancels its older run; a run on main is never cancelled once it has started
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: macOS, Node ${{ matrix.node }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # The same steps on Linux. The macOS job names above stay as they are: they are required checks.
  test-linux:
    name: Linux, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
